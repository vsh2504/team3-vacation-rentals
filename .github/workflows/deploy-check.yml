name: Deploy check (templates only, no cloud)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Frontend builds
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - name: Backend API imports (with SQLAlchemy)
        run: |
          pip install -r requirements.txt
          python3 -c "import app.main; print('API imports OK, routes:', len(app.main.app.routes))"
        working-directory: backend
      - name: Migration SQL is present and parseable (sqlite syntax check)
        run: |
          python3 -c "
          import sqlite3, pathlib
          sql = pathlib.Path('backend/db/migrations/001_init.sql').read_text()
          # strip psql-style comments only; sqlite executes the DDL
          conn = sqlite3.connect(':memory:')
          conn.executescript(sql)
          print('migration OK, tables:', [r[0] for r in conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")])
          "
      - name: No Azure provisioning in CI (guard)
        # Guard scope is deliberate: workflow files and scripts must never
        # RUN az deployment/login. infra/azure/README.md documents the
        # manual, approved command, so it is excluded from this scan.
        run: |
          ! grep -rn "az deployment\|az login" .github/workflows/ci.yml scripts/ 2>/dev/null || (echo "ERROR: CI must never provision Azure" && exit 1)
          echo "Guard OK: no az deployment/login in CI workflows or scripts"
